<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>main</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        body {
            position: relative;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        img {
            width: 100%;
            height: 100vh;
        }
        .container-menu{
            display: flex;
            justify-content: center;
        }
        nav {
            box-sizing: border-box;
            border-radius: 25px;
            width: 30%;
            padding: 10px;
            margin: 15px;
            position: absolute;
            bottom: 60px;
            display: flex;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(6px);
            justify-content: center;
            transition: 0.5s;
            outline: 2px solid transparent;
        }
        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav ul li:hover{
            cursor: pointer;
            background-color: rgba(0, 150, 255, 0.4);
        }

        nav:hover {
            outline: 2px solid black;
        }
        nav ul li {
            transition: 0.5s;
            padding: 5px 18px;
            border-radius: 25px;
        }

        nav ul li.active {
            background-color: rgba(150, 150, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container-menu">
        <nav>
            <ul>
                <li id="img1">IMG1</li>
                <li id="img2">IMG2</li>
                <li id="img3">IMG3</li>
            </ul>
        </nav>
    </div>
    
    <img src="assets/wallpaper1.jpg" alt="">

    <script>
        const img1 = document.getElementById('img1');
        const img2 = document.getElementById('img2');
        const img3 = document.getElementById('img3');

        const background = document.querySelector('img');
        const active = document.querySelector('nav ul li')

        //Para quando o site for iniciado ja marcar IMG1 de início
        let abreSite = true;
        if (abreSite == true) {
            img1.classList.add('active');
        }

//Para quando IMGx for clicado adiciona um marcador e troca o background

        img1.addEventListener('click', () => {
            background.src = "assets/wallpaper1.jpg";
            background.alt = "Paisagem verdejante de Death Stranding com uma cachoeira caindo entre penhascos rochosos cobertos de musgo, formando um rio raso em primeiro plano coberto de pedras.";
            img1.classList.add('active');
            img2.classList.remove('active');
            img3.classList.remove('active');

            abreSite = false;
        });

        img2.addEventListener('click', () => {
            background.src = "assets/wallpaper2.png";
            background.alt = "Vista de um cânion árido em Death Stranding 2, com formações rochosas em primeiro plano e arranha-céus modernos ao fundo, sob um céu claro com neblina.";
            img1.classList.remove('active');
            img2.classList.add('active');
            img3.classList.remove('active');

            abreSite = false;
        });

        img3.addEventListener('click', () => {
            background.src = "assets/wallpaper3.jpg";
            background.alt = "Paisagem desértica ao entardecer em Death Stranding 2, com terreno rochoso e vegetação seca em primeiro plano, montanhas na distância e um brilho intenso do sol no horizonte.";
            img1.classList.remove('active');
            img2.classList.remove('active');
            img3.classList.add('active');

            abreSite = false;
        });
    </script>
</body>
</html>
